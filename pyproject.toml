[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-treasury-rebalancer"
version = "0.1.0"
description = "Plan deterministic treasury rebalances with transaction fees, reserve floors and trade thresholds."
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
crypto-treasury-rebalancer = "cryptolab:main"

[tool.setuptools.packages.find]
include = ["cryptolab*"]

[tool.setuptools.package-data]
cryptolab = ["web/*"]
